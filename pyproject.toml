[tool.poetry]
name = "synfire"
version = "0.2.0"
description = "Forward-Forward + Hebbian competitive learning for time series"
authors = ["Baris Sozudogru"]
license = "MIT"
readme = "README.md"
packages = [{include = "synfire"}]

[tool.poetry.dependencies]
python = "^3.12"
numpy = "^2.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
ruff = "^0.8"
pyright = "^1.1"

[tool.poetry.group.benchmark]
optional = true

[tool.poetry.group.benchmark.dependencies]
scikit-learn = "^1.5"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "basic"

[tool.pytest.ini_options]
testpaths = ["tests"]
