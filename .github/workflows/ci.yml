name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Poetry
        run: pip install poetry
      - name: Install dependencies
        run: poetry install
      - name: Lint
        run: poetry run ruff check synfire/ tests/ benchmarks/
      - name: Type check
        run: poetry run pyright synfire/
      - name: Test
        run: poetry run pytest -v
      - name: Phase 0 Validation
        run: poetry run python -m benchmarks.phase0_validation.pipeline_validation
